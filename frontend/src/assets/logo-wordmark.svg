<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 48" width="165" height="48" role="img" aria-label="Resonance" style="display:block">
  <defs>
    <linearGradient id="rs-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- mark, scaled to the height of the wordmark -->
  <g transform="translate(0, 4)">
    <circle cx="20" cy="20" r="3" fill="url(#rs-accent)"/>

    <path d="M13 14a9 9 0 0 0 0 12" fill="none"
          stroke="url(#rs-accent)" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
    <path d="M27 14a9 9 0 0 1 0 12" fill="none"
          stroke="url(#rs-accent)" stroke-width="2" stroke-linecap="round" opacity="0.95"/>

    <path d="M9 10a14 14 0 0 0 0 20" fill="none"
          stroke="url(#rs-accent)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <path d="M31 10a14 14 0 0 1 0 20" fill="none"
          stroke="url(#rs-accent)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

    <path d="M5 6a19 19 0 0 0 0 28" fill="none"
          stroke="url(#rs-accent)" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    <path d="M35 6a19 19 0 0 1 0 28" fill="none"
          stroke="url(#rs-accent)" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- wordmark -->
  <text x="52" y="32"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="24"
        font-weight="300"
        letter-spacing="-0.02em"
        fill="#fafaf9">Resonance</text>
</svg>
