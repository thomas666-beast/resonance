<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Resonance">
  <defs>
    <linearGradient id="rs-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- center dot -->
  <circle cx="32" cy="32" r="4.5" fill="url(#rs-accent)"/>

  <!-- inner arcs (brightest) -->
  <path d="M22 24a11 11 0 0 0 0 16" fill="none"
        stroke="url(#rs-accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
  <path d="M42 24a11 11 0 0 1 0 16" fill="none"
        stroke="url(#rs-accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>

  <!-- middle arcs -->
  <path d="M17 19a18 18 0 0 0 0 26" fill="none"
        stroke="url(#rs-accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  <path d="M47 19a18 18 0 0 1 0 26" fill="none"
        stroke="url(#rs-accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>

  <!-- outer arcs (faintest) -->
  <path d="M12 14a25 25 0 0 0 0 36" fill="none"
        stroke="url(#rs-accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M52 14a25 25 0 0 1 0 36" fill="none"
        stroke="url(#rs-accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
</svg>
